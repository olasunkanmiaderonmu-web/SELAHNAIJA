<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories | Admin | Selah Naija</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="admin-body" data-admin="categories">

  <div id="admin-gate" class="admin-gate">
    <div><div class="spinner-border text-primary mb-3" role="status"></div><p class="text-muted mb-0">Checking access...</p></div>
  </div>

  <div id="admin-shell" hidden>
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-backdrop" id="admin-backdrop" hidden></div>

    <div class="admin-main">
      <header id="admin-top" class="admin-top"></header>

      <main class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div><h1 class="h3 mb-0">Categories</h1>
            <p class="text-muted mb-0">Organise music and sermons. Categories appear in the website menu in the order you set.</p></div>
          <button class="btn btn-primary" id="add-category"><i class="bi bi-plus-lg me-1"></i>Add category</button>
        </div>
        <div id="cat-list"></div>
      </main>
    </div>
  </div>

  <!-- Category -->
  <div class="modal fade" id="cat-modal" tabindex="-1" aria-labelledby="cat-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="cat-form" novalidate>
        <div class="modal-header"><h2 class="modal-title h5" id="cat-modal-title">Add category</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div id="cat-error"></div>
          <div class="mb-3"><label class="form-label" for="c-name">Name *</label><input class="form-control" id="c-name" maxlength="60" required></div>
          <div class="mb-3"><label class="form-label" for="c-slug">Web address (slug)</label><input class="form-control" id="c-slug" maxlength="80" placeholder="made-from-the-name">
            <div class="meta mt-1" id="c-slug-warning" hidden>Changing this breaks old links and bookmarks to this category.</div></div>
          <div class="mb-3"><label class="form-label" for="c-applies">Used for</label>
            <select class="form-select" id="c-applies"><option value="music">Music</option><option value="sermon">Sermons</option><option value="both">Music and sermons</option></select></div>
          <div class="mb-3"><label class="form-label" for="c-desc">Description (optional)</label><textarea class="form-control" id="c-desc" rows="2" maxlength="300"></textarea></div>
          <div class="mb-0"><label class="form-label" for="c-order">Order in the menu</label><input type="number" class="form-control" id="c-order" min="0" max="999" value="0"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
      </form>
    </div></div>
  </div>

  <!-- Subcategory -->
  <div class="modal fade" id="sub-modal" tabindex="-1" aria-labelledby="sub-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="sub-form" novalidate>
        <div class="modal-header"><h2 class="modal-title h5" id="sub-modal-title">Add subcategory</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div id="sub-error"></div>
          <p class="text-muted small" id="sub-parent"></p>
          <div class="mb-3"><label class="form-label" for="s-name">Name *</label><input class="form-control" id="s-name" maxlength="60" required></div>
          <div class="mb-3"><label class="form-label" for="s-slug">Web address (slug)</label><input class="form-control" id="s-slug" maxlength="80" placeholder="made-from-the-name">
            <div class="meta mt-1" id="s-slug-warning" hidden>Changing this breaks old links and bookmarks.</div></div>
          <div class="mb-0"><label class="form-label" for="s-order">Order</label><input type="number" class="form-control" id="s-order" min="0" max="999" value="0"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="admin-categories.js"></script>
</body>
</html>
