<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password | Selah Naija</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="login">

  <header id="site-header"></header>

  <main>
    <section class="section auth-section">
      <div class="container">
        <div class="auth-card card card-selah mx-auto">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-1">Choose a new password</h1>
            <p class="text-muted">Pick a password with at least 8 characters.</p>
            <div id="auth-msg" aria-live="polite"></div>
            <p id="reset-wait" class="text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Checking your link...</p>
            <p id="reset-new" hidden><a class="btn btn-primary" href="forgot-password.html">Request a new link</a></p>
            <form id="reset-form" hidden novalidate>
              <div class="mb-3">
                <label class="form-label" for="reset-password">New password</label>
                <div class="input-group">
                  <input type="password" id="reset-password" class="form-control form-control-lg" autocomplete="new-password" required>
                  <button class="btn btn-outline-secondary" type="button" data-toggle-password="reset-password" aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label" for="reset-password2">Confirm new password</label>
                <input type="password" id="reset-password2" class="form-control form-control-lg" autocomplete="new-password" required>
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit">Save new password</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div id="site-player"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="layout.js"></script>
  <script src="player.js"></script>
  <script src="auth.js"></script>
  <script src="auth-pages.js"></script>
</body>
</html>
