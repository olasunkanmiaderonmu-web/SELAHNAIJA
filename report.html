<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report a problem | Selah Naija</title>
  <meta name="description" content="Report a broken download, wrong information, inappropriate content or a copyright concern on Selah Naija.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="report">

  <header id="site-header"></header>

  <main>
    <section class="section auth-section">
      <div class="container">
        <div class="auth-card card card-selah mx-auto" style="max-width:600px">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-1">Report a problem</h1>
            <p class="text-muted">Tell us about a broken download, wrong information, inappropriate content or a copyright concern. We review every report.</p>
            <div id="report-about" class="alert alert-light border" hidden></div>
            <div id="report-msg" aria-live="polite"></div>
            <form id="report-form" novalidate>
              <div class="mb-3">
                <label class="form-label" for="report-reason">What is the problem? *</label>
                <select class="form-select form-select-lg" id="report-reason" required>
                  <option value="broken_download">The download or playback does not work</option>
                  <option value="wrong_information">Some information is wrong</option>
                  <option value="inappropriate">Inappropriate content</option>
                  <option value="copyright">This is my work or I own the rights (copyright)</option>
                  <option value="other">Something else</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="report-details">Details <span class="text-muted small" id="details-hint">(optional)</span></label>
                <textarea class="form-control" id="report-details" rows="5" maxlength="1000" placeholder="Please tell us what is wrong. For copyright concerns, please say who you are and how to contact you."></textarea>
                <div class="meta text-end"><span id="details-count">0</span>/1000</div>
              </div>
              <div style="position:absolute;left:-9999px" aria-hidden="true"><label>Leave this empty<input type="text" id="report-website" tabindex="-1" autocomplete="off"></label></div>
              <button class="btn btn-primary btn-lg w-100" type="submit">Send report</button>
            </form>
            <p class="text-center mt-4 mb-0"><a href="index.html">Back to the website</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div id="site-player"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="layout.js"></script>
  <script src="player.js"></script>
  <script src="report.js"></script>
</body>
</html>
