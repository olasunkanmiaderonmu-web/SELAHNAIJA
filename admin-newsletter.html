<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsletter | Admin | Selah Naija</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="admin-body" data-admin="newsletter">

  <div id="admin-gate" class="admin-gate">
    <div><div class="spinner-border text-primary mb-3" role="status"></div><p class="text-muted mb-0">Checking access...</p></div>
  </div>

  <div id="admin-shell" hidden>
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-backdrop" id="admin-backdrop" hidden></div>

    <div class="admin-main">
      <header id="admin-top" class="admin-top"></header>

      <main class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div><h1 class="h3 mb-0">Newsletter</h1><p class="text-muted mb-0">People who subscribed for updates.</p></div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" id="copy-emails"><i class="bi bi-clipboard me-1"></i>Copy emails</button>
            <button class="btn btn-primary" id="export-csv"><i class="bi bi-download me-1"></i>Export CSV</button>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6 col-md-3"><div class="card admin-card"><div class="card-body"><div class="stat-value" id="n-total">–</div><div class="stat-label">Total</div></div></div></div>
          <div class="col-6 col-md-3"><div class="card admin-card"><div class="card-body"><div class="stat-value" id="n-active">–</div><div class="stat-label">Active</div></div></div></div>
        </div>

        <div class="card admin-card"><div class="card-body">
          <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <input type="search" id="sub-search" class="form-control admin-search" placeholder="Search by email" aria-label="Search subscribers">
            <select id="sub-status" class="form-select w-auto" aria-label="Filter by status">
              <option value="">All</option><option value="active">Active</option><option value="inactive">Unsubscribed</option>
            </select>
            <span class="ms-auto text-muted" id="sub-count"></span>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Email</th><th>Status</th><th class="d-none d-md-table-cell">Subscribed</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="sub-rows"></tbody>
            </table>
          </div>
          <nav id="pager" aria-label="Pages"></nav>
        </div></div>
        <p class="meta mt-3">Sending the newsletter needs an email service (for example the free plan of Brevo). Until you connect one, use “Copy emails” or “Export CSV” to send from your own email.</p>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="songs.js"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="admin-newsletter.js"></script>
</body>
</html>
