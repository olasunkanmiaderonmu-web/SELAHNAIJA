<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account | Selah Naija</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="account">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container"><h1>My account</h1><p class="mb-0 opacity-75" id="acc-hello">Your music, your way.</p></div>
    </section>

    <section class="section">
      <div class="container">
        <div class="pill-row" id="acc-tabs">
          <button class="pill" data-tab="profile"><i class="bi bi-person me-1"></i>Profile</button>
          <button class="pill" data-tab="favourites"><i class="bi bi-heart me-1"></i>Favourites</button>
          <button class="pill" data-tab="playlists"><i class="bi bi-collection-play me-1"></i>Playlists</button>
          <button class="pill" data-tab="recent"><i class="bi bi-clock-history me-1"></i>Recently played</button>
          <button class="pill" data-tab="downloads"><i class="bi bi-download me-1"></i>Downloads</button>
        </div>

        <!-- PROFILE -->
        <div data-panel="profile" hidden>
          <div class="row g-4">
            <div class="col-lg-6">
              <div class="card card-selah"><div class="card-body p-4">
                <h2 class="h5 mb-3">Your profile</h2>
                <div class="d-flex align-items-center gap-3 mb-4">
                  <div class="acc-avatar" id="acc-avatar"></div>
                  <div>
                    <label class="btn btn-outline-primary btn-sm mb-1" for="acc-avatar-input"><i class="bi bi-camera me-1"></i>Change picture</label>
                    <input type="file" id="acc-avatar-input" accept="image/jpeg,image/png,image/webp" hidden>
                    <div class="meta">JPG, PNG or WebP, up to 2 MB.</div>
                  </div>
                </div>
                <form id="acc-profile-form" novalidate>
                  <div class="mb-3"><label class="form-label" for="acc-name">Name</label>
                    <input class="form-control" id="acc-name" maxlength="80" required></div>
                  <div class="mb-3"><label class="form-label" for="acc-email">Email</label>
                    <input class="form-control" id="acc-email" disabled></div>
                  <button class="btn btn-primary" type="submit">Save changes</button>
                </form>
              </div></div>
            </div>
            <div class="col-lg-6">
              <div class="card card-selah"><div class="card-body p-4">
                <h2 class="h5 mb-3">Change password</h2>
                <form id="acc-password-form" novalidate>
                  <div class="mb-3"><label class="form-label" for="acc-pw">New password</label>
                    <input type="password" class="form-control" id="acc-pw" autocomplete="new-password" required></div>
                  <div class="mb-3"><label class="form-label" for="acc-pw2">Confirm new password</label>
                    <input type="password" class="form-control" id="acc-pw2" autocomplete="new-password" required></div>
                  <button class="btn btn-primary" type="submit">Update password</button>
                </form>
                <hr class="my-4">
                <button class="btn btn-outline-danger" data-logout><i class="bi bi-box-arrow-right me-1"></i>Log out</button>
              </div></div>
            </div>
          </div>
        </div>

        <!-- FAVOURITES -->
        <div data-panel="favourites" hidden>
          <div class="row g-4" id="fav-grid"></div>
        </div>

        <!-- PLAYLISTS -->
        <div data-panel="playlists" hidden>
          <form class="input-group mb-4 new-playlist-form" id="new-playlist-form">
            <input class="form-control" id="new-playlist-name" maxlength="80" placeholder="New playlist name" aria-label="New playlist name" required>
            <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg me-1"></i>Create playlist</button>
          </form>
          <div class="row g-4" id="playlist-grid"></div>
        </div>

        <!-- RECENTLY PLAYED -->
        <div data-panel="recent" hidden>
          <div class="d-flex justify-content-end mb-3"><button class="btn btn-outline-primary btn-sm" id="clear-recent"><i class="bi bi-trash me-1"></i>Clear history</button></div>
          <div id="recent-songs-wrap" hidden><h2 class="h5 mb-3">Songs</h2><div class="row g-4 mb-5" id="recent-songs"></div></div>
          <div id="recent-sermons-wrap" hidden><h2 class="h5 mb-3">Sermons</h2><div class="row g-4" id="recent-sermons"></div></div>
          <div id="recent-empty"></div>
        </div>

        <!-- DOWNLOADS -->
        <div data-panel="downloads" hidden>
          <div id="download-list"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div id="site-player"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="layout.js"></script>
  <script src="player.js"></script>
  <script src="songs.js"></script>
  <script src="sermon-helpers.js"></script>
  <script src="auth.js"></script>
  <script src="account.js"></script>
</body>
</html>
