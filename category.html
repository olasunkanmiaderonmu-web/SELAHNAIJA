<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories | Selah Naija</title>
  <meta name="description" content="Browse Nigerian gospel music and sermons by category on Selah Naija.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="categories">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-2">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item"><a href="category.html">Categories</a></li>
            <li class="breadcrumb-item active" aria-current="page" id="crumb-cat">All</li>
          </ol>
        </nav>
        <h1 id="cat-title">Categories</h1>
        <p class="mb-0 opacity-75" id="cat-desc">Browse gospel music and sermons by category.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <!-- Shown when no category is chosen, or the category is not found -->
        <div id="browse-all">
          <div class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Loading...</div>
        </div>

        <!-- Shown for one category -->
        <div id="category-view" hidden>
          <div class="pill-row" id="kind-tabs" hidden></div>
          <div class="pill-row" id="sub-pills"></div>
          <div class="filter-bar">
            <select id="filter-sort" class="form-select" aria-label="Sort"></select>
            <span class="text-muted" id="result-count"></span>
          </div>
          <div class="row g-4" id="content-grid"></div>
          <nav id="pager" class="mt-5" aria-label="Pages"></nav>
        </div>

      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div id="site-player"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="layout.js"></script>
  <script src="player.js"></script>
  <script src="songs.js"></script>
  <script src="seo.js"></script>
  <script src="category.js"></script>
</body>
</html>
