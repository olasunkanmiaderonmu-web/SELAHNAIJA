<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Admin | Selah Naija</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="admin-body" data-admin="reports">

  <div id="admin-gate" class="admin-gate">
    <div><div class="spinner-border text-primary mb-3" role="status"></div><p class="text-muted mb-0">Checking access...</p></div>
  </div>

  <div id="admin-shell" hidden>
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-backdrop" id="admin-backdrop" hidden></div>

    <div class="admin-main">
      <header id="admin-top" class="admin-top"></header>

      <main class="admin-content">
        <div class="mb-3"><h1 class="h3 mb-0">Reports</h1><p class="text-muted mb-0">Problems and concerns sent by visitors: broken downloads, wrong information, inappropriate content and copyright concerns.</p></div>

        <div class="card admin-card"><div class="card-body">
          <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <select id="rep-status" class="form-select w-auto" aria-label="Filter by status">
              <option value="open">Open</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option><option value="">All</option>
            </select>
            <select id="rep-reason" class="form-select w-auto" aria-label="Filter by reason">
              <option value="">All reasons</option><option value="broken_download">Broken download</option><option value="wrong_information">Wrong information</option>
              <option value="inappropriate">Inappropriate content</option><option value="copyright">Copyright concern</option><option value="other">Other</option>
            </select>
            <span class="ms-auto text-muted" id="rep-count"></span>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>About</th><th>Reason</th><th class="d-none d-lg-table-cell">Details</th><th>Status</th><th class="d-none d-md-table-cell">Received</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="rep-rows"></tbody>
            </table>
          </div>
          <nav id="pager" aria-label="Pages"></nav>
        </div></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="songs.js"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="admin-reports.js"></script>
</body>
</html>
