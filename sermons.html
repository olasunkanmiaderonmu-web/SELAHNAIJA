<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sermons | Selah Naija</title>
  <meta name="description" content="Listen to and download sermons from Nigerian pastors, ministers and Christian speakers on Selah Naija.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="sermons">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Sermons</h1>
        <p class="mb-0 opacity-75">Inspiring messages from Nigerian pastors, ministers and Christian speakers.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <div id="preacher-wrap" hidden>
          <h2 class="h6 text-muted text-uppercase mb-2">Preachers</h2>
          <div class="preacher-strip" id="preacher-strip"></div>
        </div>

        <div class="filter-bar">
          <form class="input-group sermon-search" id="search-form" role="search">
            <input type="search" id="search-input" class="form-control" placeholder="Search by preacher, topic or title..." aria-label="Search sermons">
            <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
          </form>
          <div class="d-flex flex-wrap gap-2">
            <select id="filter-category" class="form-select" aria-label="Filter by category"></select>
            <select id="filter-sort" class="form-select" aria-label="Sort sermons"></select>
          </div>
        </div>
        <p class="text-muted" id="result-count"></p>

        <div class="row g-4" id="sermon-grid"></div>
        <nav id="pager" class="mt-5" aria-label="Pages"></nav>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div id="site-player"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="layout.js"></script>
  <script src="player.js"></script>
  <script src="songs.js"></script>
  <script src="sermon-helpers.js"></script>
  <script src="sermons.js"></script>
</body>
</html>
