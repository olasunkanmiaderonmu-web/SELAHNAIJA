<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | Admin | Selah Naija</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="admin-body" data-admin="users">

  <div id="admin-gate" class="admin-gate">
    <div><div class="spinner-border text-primary mb-3" role="status"></div><p class="text-muted mb-0">Checking access...</p></div>
  </div>

  <div id="admin-shell" hidden>
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-backdrop" id="admin-backdrop" hidden></div>

    <div class="admin-main">
      <header id="admin-top" class="admin-top"></header>

      <main class="admin-content">
        <div class="mb-3"><h1 class="h3 mb-0">Users</h1><p class="text-muted mb-0">People with accounts. Visitors who only listen and download do not appear here.</p></div>

        <div class="card admin-card"><div class="card-body">
          <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <input type="search" id="user-search" class="form-control admin-search" placeholder="Search by name or email" aria-label="Search users">
            <span class="ms-auto text-muted" id="user-count"></span>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>User</th><th>Roles</th><th>Status</th><th class="d-none d-lg-table-cell">Joined</th><th class="d-none d-xl-table-cell">Activity</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="user-rows"></tbody>
            </table>
          </div>
          <nav id="pager" aria-label="Pages"></nav>
        </div></div>
      </main>
    </div>
  </div>

  <!-- Roles -->
  <div class="modal fade" id="roles-modal" tabindex="-1" aria-labelledby="roles-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="roles-title">Roles</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <p class="text-muted small" id="roles-who"></p>
        <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="role-admin" data-role="admin"><label class="form-check-label" for="role-admin"><strong>Admin</strong><br><span class="meta">Full control of the website, content and users.</span></label></div>
        <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="role-moderator" data-role="moderator"><label class="form-check-label" for="role-moderator"><strong>Moderator</strong><br><span class="meta">Can review reports and, later, user submissions.</span></label></div>
        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="role-artist" data-role="artist"><label class="form-check-label" for="role-artist"><strong>Artist</strong><br><span class="meta">Reserved for the future artist accounts feature.</span></label></div>
      </div>
    </div></div>
  </div>

  <!-- Activity -->
  <div class="modal fade" id="activity-modal" tabindex="-1" aria-labelledby="activity-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5 text-truncate" id="activity-title">Activity</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="activity-body"></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="songs.js"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="admin-users.js"></script>
</body>
</html>
