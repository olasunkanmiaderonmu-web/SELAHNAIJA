<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard | Selah Naija</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body class="admin-body" data-admin="dashboard">

  <div id="admin-gate" class="admin-gate">
    <div>
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p class="text-muted mb-0">Checking access...</p>
    </div>
  </div>

  <div id="admin-shell" hidden>
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-backdrop" id="admin-backdrop" hidden></div>

    <div class="admin-main">
      <header id="admin-top" class="admin-top"></header>

      <main class="admin-content">
        <h1 class="h3 mb-1">Dashboard</h1>
        <p class="text-muted mb-4">A live summary of your website.</p>

        <div class="row g-3 mb-4" id="stat-cards"></div>

        <div class="row g-3 mb-4">
          <div class="col-12">
            <div class="card admin-card">
              <div class="card-body d-flex flex-wrap gap-2 align-items-center">
                <span class="fw-semibold me-2">Quick actions</span>
                <a class="btn btn-primary btn-sm" href="admin-music.html?new=1"><i
                    class="bi bi-cloud-arrow-up me-1"></i>Upload song</a>
                <a class="btn btn-primary btn-sm" href="admin-sermons.html?new=1"><i
                    class="bi bi-cloud-arrow-up me-1"></i>Upload sermon</a>
                <a class="btn btn-outline-primary btn-sm" href="admin-artists.html?new=1"><i
                    class="bi bi-plus-lg me-1"></i>Add artist</a>
                <a class="btn btn-outline-primary btn-sm" href="admin-categories.html"><i
                    class="bi bi-folder2-open me-1"></i>Manage categories</a>
                <a class="btn btn-outline-primary btn-sm" href="index.html" target="_blank" rel="noopener"><i
                    class="bi bi-box-arrow-up-right me-1"></i>View website</a>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-6">
            <div class="card admin-card h-100">
              <div class="card-body">
                <h2 class="h6 text-uppercase text-muted">Most downloaded songs</h2>
                <div id="top-downloads"></div>
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card admin-card h-100">
              <div class="card-body">
                <h2 class="h6 text-uppercase text-muted">Most played songs</h2>
                <div id="top-plays"></div>
              </div>
            </div>
          </div>
          <div class="col-12">
            <div class="card admin-card">
              <div class="card-body">
                <h2 class="h6 text-uppercase text-muted">Recent uploads</h2>
                <div id="recent-uploads"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="admin-dashboard.js"></script>
</body>

</html>
