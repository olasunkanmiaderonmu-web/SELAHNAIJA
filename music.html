<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Library | Selah Naija</title>
  <meta name="description" content="Browse, stream and download Nigerian gospel music on Selah Naija.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body data-page="music" data-sort="popular">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Music Library</h1>
        <p class="mb-0 opacity-75">Stream and download Nigerian gospel music.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <div class="d-flex flex-wrap gap-2">
            <select id="filter-category" class="form-select" aria-label="Filter by category"></select>
            <select id="filter-sort" class="form-select" aria-label="Sort songs"></select>
          </div>
          <span class="text-muted" id="result-count"></span>
        </div>
        <div class="row g-4" id="song-grid"></div>
        <nav id="pager" class="mt-5" aria-label="Pages"></nav>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div id="site-player"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="layout.js"></script>
  <script src="player.js"></script>
  <script src="songs.js"></script>
  <script src="music.js"></script>
