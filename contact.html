<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Selah Naija</title>
  <meta name="description" content="Contact the Selah Naija team with questions, suggestions or requests.">
  <meta property="og:title" content="Contact Us | Selah Naija">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="contact">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p class="mb-0 opacity-75">We would love to hear from you.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-5">
            <h2 class="h4">Get in touch</h2>
            <p class="text-muted">Send us a message using the form. For a broken download or a content concern, please use <a href="report.html">Report a problem</a> instead, so we can find it quickly.</p>
            <ul class="contact-info list-unstyled" id="contact-info"></ul>
          </div>
          <div class="col-lg-7">
            <div class="card card-selah"><div class="card-body p-4">
              <div id="contact-msg" aria-live="polite"></div>
              <form id="contact-form" novalidate>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label" for="c-name">Your name *</label><input class="form-control" id="c-name" maxlength="100" autocomplete="name" required></div>
                  <div class="col-md-6"><label class="form-label" for="c-email">Your email *</label><input type="email" class="form-control" id="c-email" maxlength="254" autocomplete="email" required></div>
                  <div class="col-12"><label class="form-label" for="c-subject">Subject</label><input class="form-control" id="c-subject" maxlength="150"></div>
                  <div class="col-12"><label class="form-label" for="c-message">Message *</label><textarea class="form-control" id="c-message" rows="6" maxlength="3000" required></textarea>
                    <div class="meta text-end"><span id="msg-count">0</span>/3000</div></div>
                  <div style="position:absolute;left:-9999px" aria-hidden="true"><label>Leave this empty<input type="text" id="c-website" tabindex="-1" autocomplete="off"></label></div>
                  <div class="col-12"><button class="btn btn-primary btn-lg px-5" type="submit">Send message</button></div>
                </div>
              </form>
            </div></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div id="site-player"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="layout.js"></script>
  <script src="player.js"></script>
  <script src="contact.js"></script>
</body>
</html>
