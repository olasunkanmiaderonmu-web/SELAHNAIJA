<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preachers | Admin | Selah Naija</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23241044'/%3E%3Crect x='47' y='14' width='6' height='72' rx='3' fill='%23D6AD55'/%3E%3Crect x='40' y='32' width='20' height='6' rx='3' fill='%23D6AD55'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="brand.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="admin-body" data-admin="preachers">

  <div id="admin-gate" class="admin-gate">
    <div><div class="spinner-border text-primary mb-3" role="status"></div><p class="text-muted mb-0">Checking access...</p></div>
  </div>

  <div id="admin-shell" hidden>
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <div class="admin-backdrop" id="admin-backdrop" hidden></div>

    <div class="admin-main">
      <header id="admin-top" class="admin-top"></header>

      <main class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div><h1 class="h3 mb-0">Preachers</h1><p class="text-muted mb-0">Pastors, ministers and speakers whose sermons you share.</p></div>
          <button class="btn btn-primary" id="add-preacher"><i class="bi bi-plus-lg me-1"></i>Add preacher</button>
        </div>

        <div class="card admin-card"><div class="card-body">
          <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <input type="search" id="preacher-search" class="form-control admin-search" placeholder="Search preachers by name" aria-label="Search preachers">
            <span class="ms-auto text-muted" id="preacher-count"></span>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th style="width:56px"></th><th>Name</th><th class="d-none d-md-table-cell">Church / ministry</th><th>Sermons</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="preacher-rows"></tbody>
            </table>
          </div>
          <nav id="pager" aria-label="Pages"></nav>
        </div></div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="preacher-modal" tabindex="-1" aria-labelledby="preacher-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <form id="preacher-form" novalidate>
        <div class="modal-header"><h2 class="modal-title h5" id="preacher-modal-title">Add preacher</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div id="form-error"></div>
          <div class="row g-3">
            <div class="col-md-7"><label class="form-label" for="p-name">Name *</label><input class="form-control" id="p-name" maxlength="120" required></div>
            <div class="col-md-5"><label class="form-label" for="p-slug">Web address (slug)</label><input class="form-control" id="p-slug" maxlength="140" placeholder="made-from-the-name"></div>
            <div class="col-12"><label class="form-label" for="p-church">Church or ministry</label><input class="form-control" id="p-church" maxlength="120"></div>
            <div class="col-12"><label class="form-label" for="p-bio">Biography</label><textarea class="form-control" id="p-bio" rows="4" maxlength="2000"></textarea></div>
            <div class="col-12">
              <label class="form-label d-block">Photograph</label>
              <div class="d-flex align-items-center gap-3">
                <div class="acc-avatar" id="p-photo-preview"><i class="bi bi-person-fill"></i></div>
                <div>
                  <label class="btn btn-outline-primary btn-sm mb-1" for="p-photo"><i class="bi bi-camera me-1"></i>Choose picture</label>
                  <input type="file" id="p-photo" accept="image/jpeg,image/png,image/webp" hidden>
                  <button type="button" class="btn btn-outline-danger btn-sm mb-1" id="p-photo-remove" hidden>Remove picture</button>
                  <div class="meta">JPG, PNG or WebP. It is resized automatically.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save preacher</button></div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="utils.js"></script>
  <script src="songs.js"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="admin-preachers.js"></script>
</body>
</html>
